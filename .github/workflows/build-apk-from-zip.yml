name: Build MadFlash APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "madflash-apk-cloud-build.zip"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract project archive
        run: |
          if [ ! -f "madflash-apk-cloud-build.zip" ]; then
            echo "::error::Missing madflash-apk-cloud-build.zip. Upload the project ZIP to the repository root."
            exit 1
          fi
          mkdir -p source
          unzip -q madflash-apk-cloud-build.zip -d source
          test -f source/madflash-apk/package.json || {
            echo "::error::The archive must contain madflash-apk/package.json."
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install JavaScript dependencies
        working-directory: source/madflash-apk
        run: npm install --no-audit --no-fund

      - name: Build web application
        working-directory: source/madflash-apk
        run: npm run build

      - name: Create Android project
        working-directory: source/madflash-apk
        run: npx cap add android

      - name: Sync Capacitor assets
        working-directory: source/madflash-apk
        run: npx cap sync android

      - name: Build debug APK
        working-directory: source/madflash-apk/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MadFlash-debug-apk
          path: source/madflash-apk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
